name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Lint
        run: uvx ruff check prototypes/ _template/

      - name: Check formatting
        run: uvx ruff format --check prototypes/ _template/
