{% set href = "/" + flow.id + "/" + block.to if block.to else None %}
{% set broken = block.to and block.to not in flow_screens %}
<div class="c-box mb-3">
    <h3 class="h4 mb-3">{{ block.title }}</h3>
    <ul class="list-group list-group-flush">
        {% for i in range(1, block.rows + 1) %}
        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
            <span>Dossier #{{ i }}</span>
            <small class="text-muted">il y a {{ i }}h</small>
        </li>
        {% endfor %}
    </ul>
    {% if href %}
    <div class="text-end mt-3">
        <a href="{{ href }}" {% if broken %}data-flux-broken="true"{% endif %}>
            Voir tout <i class="ri-arrow-right-line" aria-hidden="true"></i>
        </a>
    </div>
    {% endif %}
</div>
