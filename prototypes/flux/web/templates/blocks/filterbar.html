{# Inert filter chips — opaque labels in v1. #}
<div class="d-flex flex-wrap gap-2 mb-3">
    {% for label in block.filters %}
    <span class="btn btn-outline-primary btn-sm">
        <i class="ri-filter-line fw-medium" aria-hidden="true"></i>
        <span>{{ label }}</span>
    </span>
    {% endfor %}
</div>
